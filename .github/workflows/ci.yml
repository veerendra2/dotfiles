---
name: CI

"on":
  push:
    branches:
      - master
      - main
      - refactor-to-make-monorepo
  pull_request:
    branches:
      - master
      - main
      - refactor-to-make-monorepo

jobs:
  lint:
    name: Lint Dotfiles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint YAML (yamllint)
        run: |
          pip install yamllint
          yamllint .

      - name: Lint JSON (jq)
        run: |
          find . -name "*.json" -not -path "*/.*" -not -path "*/node_modules/*" | xargs -I {} jq empty {}

      - name: Lint TOML (Taplo CLI)
        run: |
          npm install -g @taplo/cli
          taplo lint

      - name: Validate Brewfiles (Ruby syntax check)
        run: |
          find . -name "Brewfile*" | xargs -I {} ruby -wc {}

      - name: Validate Aptfile Syntax (Directive Check)
        run: |
          find . -name "Aptfile*" | xargs perl -ne 'next if /^\s*(#|$)/; exit 1 unless /^(apt|ppa|deb|key)\s+/'

      - name: Diagnostic Aptfile Cache Check
        run: |
          curl -fsSL https://raw.githubusercontent.com/apt-bundle/apt-bundle/main/install.sh | sudo bash
          find . -name "Aptfile*" | xargs -I {} apt-bundle check --file {} --no-update || true
